<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Human × AI Teaming — Interactive Walkthrough</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Fraunces:ital,wght@0,300;0,600;0,900;1,300;1,600&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07080d;
    --surface: #0e1018;
    --card: #13151f;
    --border: #1e2130;
    --border-light: #2a2d3e;
    --text: #e8eaf2;
    --text-dim: #6b7094;
    --text-mid: #a0a5c0;

    --collab: #3de8b0;
    --collab-dim: rgba(61,232,176,0.12);
    --ethics: #f0c060;
    --ethics-dim: rgba(240,192,96,0.12);
    --learn: #7eb8ff;
    --learn-dim: rgba(126,184,255,0.12);
    --collective: #c97eff;
    --collective-dim: rgba(201,126,255,0.12);

    --danger: #ff4f6a;
    --warn: #ffb347;
    --ok: #3de8b0;

    --radius: 12px;
    --radius-sm: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── NOISE OVERLAY ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 9999; opacity: .4;
  }

  /* ── HEADER ── */
  header {
    padding: 48px 40px 32px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-end; gap: 32px;
    flex-wrap: wrap;
  }
  .logo-block { flex: 1; }
  .logo-eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 10px; letter-spacing: .2em;
    color: var(--text-dim); text-transform: uppercase;
    margin-bottom: 8px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-size: clamp(28px, 5vw, 52px);
    font-weight: 900; line-height: 1.0;
    background: linear-gradient(135deg, #ffffff 0%, var(--text-mid) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  h1 em { font-style: italic; color: var(--collab); -webkit-text-fill-color: var(--collab); }
  .header-meta {
    font-family: 'DM Mono', monospace;
    font-size: 11px; color: var(--text-dim);
    line-height: 1.8;
  }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

  /* ── CATEGORY TABS ── */
  .tabs {
    display: flex; gap: 0;
    padding: 0 40px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    padding: 16px 24px;
    font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    cursor: pointer; border: none; background: none;
    color: var(--text-dim); border-bottom: 2px solid transparent;
    transition: all .2s; white-space: nowrap;
    display: flex; align-items: center; gap: 8px;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: currentColor; }
  .tab[data-cat="all"] .dot { background: linear-gradient(135deg, var(--collab), var(--collective)); }
  .tab[data-cat="collab"] .dot { background: var(--collab); }
  .tab[data-cat="ethics"] .dot { background: var(--ethics); }
  .tab[data-cat="learn"] .dot { background: var(--learn); }
  .tab[data-cat="collective"] .dot { background: var(--collective); }

  /* ── LAYOUT ── */
  .layout {
    display: grid;
    grid-template-columns: 300px 1fr;
    min-height: calc(100vh - 200px);
  }

  /* ── SIDEBAR ── */
  .sidebar {
    border-right: 1px solid var(--border);
    padding: 24px 0;
    overflow-y: auto;
    position: sticky; top: 0; max-height: calc(100vh - 160px);
  }
  .sidebar-section { margin-bottom: 8px; }
  .sidebar-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--text-dim); padding: 8px 20px 4px;
  }
  .scenario-btn {
    width: 100%; text-align: left; background: none; border: none;
    padding: 10px 20px; cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    transition: background .15s;
    border-left: 2px solid transparent;
  }
  .scenario-btn:hover { background: var(--surface); }
  .scenario-btn.active { background: var(--surface); border-left-color: var(--accent-color, var(--collab)); }
  .scenario-btn .s-icon { font-size: 16px; flex-shrink: 0; }
  .scenario-btn .s-title {
    font-size: 12px; font-weight: 600; color: var(--text);
    line-height: 1.3;
  }
  .scenario-btn .s-tag {
    font-family: 'DM Mono', monospace;
    font-size: 9px; color: var(--text-dim); margin-top: 1px;
  }
  .scenario-btn.active .s-title { color: var(--accent-color, var(--collab)); }

  /* ── MAIN PANEL ── */
  .main { padding: 40px; overflow-y: auto; }

  .scenario-header {
    display: flex; align-items: flex-start; gap: 20px;
    margin-bottom: 32px;
  }
  .scenario-icon-big {
    font-size: 44px; flex-shrink: 0;
    background: var(--card); border: 1px solid var(--border);
    width: 72px; height: 72px; border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
  }
  .scenario-meta .cat-badge {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 9px; letter-spacing: .15em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 3px;
    margin-bottom: 8px;
  }
  .scenario-title {
    font-family: 'Fraunces', serif;
    font-size: clamp(22px, 3vw, 34px);
    font-weight: 600; line-height: 1.15;
  }
  .scenario-subtitle {
    color: var(--text-mid); font-size: 13px; margin-top: 4px;
  }

  /* ── CARDS GRID ── */
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px;
  }
  .card-title {
    font-family: 'DM Mono', monospace;
    font-size: 9px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--text-dim); margin-bottom: 12px;
  }
  .card p, .card li { font-size: 13px; color: var(--text-mid); line-height: 1.7; }
  .card ul { padding-left: 16px; }
  .card li { margin-bottom: 4px; }

  /* ── AI TERMINAL ── */
  .ai-terminal {
    background: #080a10; border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
    margin-bottom: 24px;
  }
  .terminal-bar {
    background: var(--surface); padding: 10px 16px;
    display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid var(--border);
  }
  .terminal-dot { width: 10px; height: 10px; border-radius: 50%; }
  .terminal-bar span {
    font-family: 'DM Mono', monospace;
    font-size: 10px; color: var(--text-dim); margin-left: 8px;
  }
  .terminal-body { padding: 20px 24px; font-family: 'DM Mono', monospace; }
  .terminal-line { font-size: 12px; line-height: 2; display: flex; align-items: center; gap: 10px; }
  .terminal-line .prefix { color: var(--text-dim); }
  .terminal-line .msg { color: var(--text); }
  .terminal-line .highlight { font-weight: 500; }
  .terminal-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .t-btn {
    padding: 7px 18px; border-radius: var(--radius-sm);
    font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500;
    cursor: pointer; border: 1px solid; transition: all .2s;
  }
  .t-btn.yes { background: rgba(61,232,176,.15); border-color: var(--collab); color: var(--collab); }
  .t-btn.no { background: rgba(255,79,106,.1); border-color: var(--danger); color: var(--danger); }
  .t-btn.neutral { background: var(--surface); border-color: var(--border-light); color: var(--text-mid); }
  .t-btn:hover { filter: brightness(1.2); transform: translateY(-1px); }
  .t-btn.clicked { opacity: .5; pointer-events: none; }

  .response-bubble {
    margin-top: 12px; padding: 12px 16px;
    border-radius: var(--radius-sm); font-family: 'DM Mono', monospace; font-size: 11px;
    display: none; animation: fadeSlide .3s ease;
  }
  .response-bubble.show { display: block; }
  .response-bubble.ok { background: rgba(61,232,176,.1); border: 1px solid rgba(61,232,176,.3); color: var(--collab); }
  .response-bubble.warn { background: rgba(255,179,71,.1); border: 1px solid rgba(255,179,71,.3); color: var(--warn); }
  .response-bubble.bad { background: rgba(255,79,106,.1); border: 1px solid rgba(255,79,106,.3); color: var(--danger); }

  @keyframes fadeSlide { from { opacity:0; transform: translateY(4px); } to { opacity:1; transform:none; } }

  /* ── INSIGHT PILLS ── */
  .insights { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 32px; }
  .insight {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 99px;
    font-size: 11px; font-weight: 600;
    border: 1px solid; background: transparent;
  }
  .insight::before { content: '✔'; font-size: 9px; }

  /* ── TIMELINE NAVIGATOR ── */
  .nav-row {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 24px; border-top: 1px solid var(--border);
  }
  .nav-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 20px; border-radius: var(--radius-sm);
    background: var(--card); border: 1px solid var(--border);
    color: var(--text-mid); font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all .2s;
  }
  .nav-btn:hover { border-color: var(--border-light); color: var(--text); background: var(--surface); }
  .nav-btn:disabled { opacity: .3; pointer-events: none; }
  .nav-counter {
    font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-dim);
  }

  /* ── PROGRESS STRIP ── */
  .progress-strip {
    display: flex; gap: 4px; padding: 16px 40px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .progress-dot {
    width: 28px; height: 4px; border-radius: 2px;
    background: var(--border); transition: background .3s; flex-shrink: 0;
    cursor: pointer;
  }
  .progress-dot.active { background: var(--accent-current, var(--collab)); }
  .progress-dot.visited { background: var(--border-light); }

  /* ── SCENARIO CONTENT ANIMATION ── */
  .scenario-view { animation: fadeIn .35s ease; }
  @keyframes fadeIn { from { opacity:0; transform: translateX(12px); } to { opacity:1; transform:none; } }

  /* ── HIDDEN ── */
  .hidden { display: none !important; }

  /* ── RESPONSIVE ── */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: relative; max-height: none; border-right: none; border-bottom: 1px solid var(--border); }
    .cards { grid-template-columns: 1fr; }
    header { padding: 28px 20px 20px; }
    .tabs { padding: 0 20px; }
    .main { padding: 24px 20px; }
    .progress-strip { padding: 12px 20px; }
  }

  /* ── CONFIDENCE METER ── */
  .confidence-bar {
    height: 6px; border-radius: 3px; background: var(--border);
    overflow: hidden; margin: 8px 0;
  }
  .confidence-fill { height: 100%; border-radius: 3px; transition: width 1s ease; }

  /* ── TIMELINE EMBED ── */
  .mini-timeline {
    display: flex; gap: 0; margin-bottom: 20px; overflow: hidden;
    border-radius: var(--radius); border: 1px solid var(--border);
  }
  .tl-step {
    flex: 1; padding: 10px 8px; text-align: center;
    font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text-dim);
    border-right: 1px solid var(--border); transition: background .2s;
    cursor: default;
  }
  .tl-step:last-child { border-right: none; }
  .tl-step.current { background: var(--card); color: var(--text); font-weight: 500; }
  .tl-step .tl-dot { font-size: 14px; display: block; margin-bottom: 3px; }

  /* ─── FLEET VIZ ─── */
  .fleet-grid {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px;
    padding: 16px; background: #080a10;
    border-radius: var(--radius); border: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .fleet-car {
    aspect-ratio: 1; border-radius: 4px;
    background: var(--border); font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: all .4s;
  }
  .fleet-car.reporting { background: rgba(201,126,255,.25); animation: pulse 1.5s infinite; }
  .fleet-car.affected { background: rgba(126,184,255,.15); }
  .fleet-car.you { background: rgba(61,232,176,.2); border: 1px solid var(--collab); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

</style>
</head>
<body>

<header>
  <div class="logo-block">
    <p class="logo-eyebrow">Interactive Walkthrough · Human × AI Systems</p>
    <h1>When <em>humans</em> &<br>machines think together</h1>
  </div>
  <div class="header-meta">
    <div><span class="dot" style="background:var(--collab)"></span> Collaboration</div>
    <div><span class="dot" style="background:var(--ethics)"></span> Ethics</div>
    <div><span class="dot" style="background:var(--learn)"></span> Learning</div>
    <div><span class="dot" style="background:var(--collective)"></span> Collective Intelligence</div>
  </div>
</header>

<div class="tabs">
  <button class="tab active" data-cat="all"><span class="dot" style="background:linear-gradient(135deg,var(--collab),var(--collective))"></span>All Scenarios</button>
  <button class="tab" data-cat="collab"><span class="dot" style="background:var(--collab)"></span>Collaboration</button>
  <button class="tab" data-cat="ethics"><span class="dot" style="background:var(--ethics)"></span>Ethics</button>
  <button class="tab" data-cat="learn"><span class="dot" style="background:var(--learn)"></span>Learning</button>
  <button class="tab" data-cat="collective"><span class="dot" style="background:var(--collective)"></span>Collective Intelligence</button>
</div>

<div class="progress-strip" id="progressStrip"></div>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>
</div>

<script>
const SCENARIOS = [
  // ── COLLABORATION ──
  {
    id: 'c1', cat: 'collab', icon: '🤝',
    title: 'Negotiated Handoff',
    subtitle: 'Human delegates, AI explains',
    situation: 'Driver approaches a complex roundabout in an unfamiliar city and voluntarily asks AI to take over temporarily.',
    humanRole: ['Initiates delegation ("take over")','Receives explanation after','Resumes control at marked point'],
    aiRole: ['Accepts delegation gracefully','Executes navigation','Explains decisions post-hoc'],
    terminal: {
      lines: [
        { prefix: 'SYS', msg: 'Complex roundabout detected — 4 exits, irregular signage' },
        { prefix: 'AI', msg: 'Driver request received: temporary control transfer', highlight: true },
        { prefix: 'AI', msg: 'Taking control for roundabout — I\'ll hand back at exit 3' },
        { prefix: 'AI', msg: 'Navigating... exit 1... exit 2... exit 3 approaching' },
        { prefix: 'AI', msg: 'You have control. I took exit 3 at 28 km/h due to blind curve' },
      ],
      actions: [
        { label: 'Take over please', type: 'yes', response: { type: 'ok', msg: '✔ Control transferred. Resuming at Exit 3 as agreed.' } },
        { label: 'I\'ll manage', type: 'neutral', response: { type: 'warn', msg: '⚠ Understood. Staying advisory. Watch for the blind exit.' } },
      ]
    },
    insights: ['Human-initiated delegation', 'AI explains its reasoning', 'Collaboration is bidirectional'],
    accentVar: '--collab',
  },
  {
    id: 'c2', cat: 'collab', icon: '👁',
    title: 'Shared Attention',
    subtitle: 'AI covers the driver\'s blind spot',
    situation: 'Driver is focused on merging left. AI notices a child near the curb on the right — outside the driver\'s current attention zone.',
    humanRole: ['Focuses on left-lane merge','Receives subtle right-side alert','Makes final decision on speed'],
    aiRole: ['Monitors full 360° environment','Issues low-priority awareness alert','Does NOT interrupt main task'],
    terminal: {
      lines: [
        { prefix: 'SYS', msg: 'Driver attention: LEFT (merge in progress)' },
        { prefix: 'AI', msg: 'Pedestrian detected RIGHT — child, stationary, 4m', highlight: true },
        { prefix: 'AI', msg: '⚡ Soft alert only — no action needed, just awareness' },
        { prefix: 'AI', msg: 'Merge completed. Pedestrian clear. All good.' },
      ],
      actions: [
        { label: 'Got it, thanks', type: 'yes', response: { type: 'ok', msg: '✔ Noted. Continuing monitoring.' } },
        { label: 'Slowing down', type: 'neutral', response: { type: 'ok', msg: '✔ Speed reduced. Child zone cleared.' } },
      ]
    },
    insights: ['AI fills attention gaps without overloading', 'Division of cognitive labor', 'Complementary perception'],
    accentVar: '--collab',
  },
  {
    id: 'c3', cat: 'collab', icon: '🎛',
    title: 'Adaptive Assistance',
    subtitle: 'AI calibrates to the human',
    situation: 'Same road, two drivers: an experienced veteran on a familiar route vs. a new driver in heavy rain. AI behaves completely differently.',
    humanRole: ['Profile is learned over time','Expert: gets space to drive','Novice: gets more guidance'],
    aiRole: ['Reads driver profile + conditions','Silently adjusts verbosity','Never announces the change'],
    terminal: {
      lines: [
        { prefix: 'PROFILE', msg: 'Driver: Expert · Route: Known · Conditions: Rain' },
        { prefix: 'AI', msg: 'Assistance level → Minimal. Monitoring only.', highlight: true },
        { prefix: '---', msg: '--- NEW SESSION ---' },
        { prefix: 'PROFILE', msg: 'Driver: Novice · Route: Unknown · Conditions: Rain' },
        { prefix: 'AI', msg: 'Assistance level → Enhanced. Proactive guidance active.', highlight: true },
      ],
      actions: []
    },
    insights: ['AI calibrates to the human', 'Not one-size-fits-all', 'Teaming adapts over time'],
    accentVar: '--collab',
    showConfidence: { label: 'AI Assistance Level', value: 25, label2: 'For expert driver', color: 'var(--collab)' },
  },
  {
    id: 'c4', cat: 'collab', icon: '😴',
    title: 'Co-piloting Under Fatigue',
    subtitle: 'AI as supportive partner, not alarm',
    situation: '3-hour drive. AI detects micro-drowsiness signals: increased blink rate, subtle steering drift, slower response times.',
    humanRole: ['Continues driving','Receives gentle offer — not a warning','Chooses how to respond'],
    aiRole: ['Detects fatigue signals early','Offers options, not ultimatums','Gradually increases load-sharing'],
    terminal: {
      lines: [
        { prefix: 'SYS', msg: 'Drive duration: 2h 41min · Blink rate: ↑ · Drift: detected' },
        { prefix: 'AI', msg: 'You\'ve been at this a while. I\'ll take more of the load.', highlight: true },
        { prefix: 'AI', msg: 'Want music? Or shall I find a rest stop nearby?' },
        { prefix: 'AI', msg: 'No pressure — just here if you need me.' },
      ],
      actions: [
        { label: 'Find rest stop', type: 'yes', response: { type: 'ok', msg: '✔ Rest stop in 3.2km. Gentle lane guidance active.' } },
        { label: 'I\'m fine, thanks', type: 'neutral', response: { type: 'warn', msg: '⚠ Understood. I\'ll stay alert on your behalf.' } },
        { label: 'Play some music', type: 'neutral', response: { type: 'ok', msg: '✔ Calm playlist started. Continuing to monitor.' } },
      ]
    },
    insights: ['AI as supportive partner', 'Proactive without paternalistic', 'Human dignity preserved'],
    accentVar: '--collab',
  },

  // ── ETHICS ──
  {
    id: 'e1', cat: 'ethics', icon: '⚖️',
    title: 'The Trolley Problem at 80km/h',
    subtitle: 'When AI must act faster than consent',
    situation: 'Sudden obstacle. Swerving avoids it but risks a cyclist in the bike lane. Hard braking risks rear collision. Decision window: 200ms.',
    humanRole: ['Cannot decide in time','Reviews decision report after','Retains right to contest'],
    aiRole: ['Acts on least-harm algorithm','Immediately flags the decision made','Generates full accountability log'],
    terminal: {
      lines: [
        { prefix: 'T-0.2s', msg: 'OBSTACLE DETECTED — decision window: 200ms' },
        { prefix: 'AI', msg: 'Options: [A] swerve — cyclist risk [B] brake — rear risk', highlight: true },
        { prefix: 'AI', msg: 'Estimated harm minimized: OPTION B selected' },
        { prefix: 'AI', msg: '🚨 Emergency braking activated' },
        { prefix: 'LOG', msg: 'Full decision record saved · Sharing requires your consent' },
      ],
      actions: [
        { label: 'View decision log', type: 'neutral', response: { type: 'ok', msg: '📋 Log: T-0.2s obstacle, T-0.18s analysis, T-0 action. Option B reduced estimated harm by 60%.' } },
        { label: 'Share with insurer', type: 'yes', response: { type: 'ok', msg: '✔ Report shared. AI action clearly timestamped.' } },
      ]
    },
    insights: ['AI acts faster than consent allows', 'But is accountable afterward', 'Ethics is documented, not avoided'],
    accentVar: '--ethics',
  },
  {
    id: 'e2', cat: 'ethics', icon: '🔒',
    title: 'Privacy vs. Safety',
    subtitle: 'Consent under pressure',
    situation: 'AI detects signs of a medical episode in the driver. Calling emergency services requires sharing location data the driver previously opted out of.',
    humanRole: ['Previously opted out of location sharing','Receives urgent consent request','Has timed override option'],
    aiRole: ['Detects medical signals','Requests consent before acting','Defaults to safety after countdown'],
    terminal: {
      lines: [
        { prefix: 'SYS', msg: 'Biometric anomaly detected — possible medical event' },
        { prefix: 'AI', msg: '⚠ I\'m concerned about your safety', highlight: true },
        { prefix: 'AI', msg: 'To call for help I need to share your location' },
        { prefix: 'AI', msg: 'Your privacy setting: OFF · Override required' },
        { prefix: 'AI', msg: 'Calling in 10s if no response... [9] [8]...' },
      ],
      actions: [
        { label: 'YES — call for help', type: 'yes', response: { type: 'ok', msg: '✔ Emergency services contacted. Location shared. Help en route.' } },
        { label: 'NO — I\'m okay', type: 'no', response: { type: 'warn', msg: '⚠ Understood. Monitoring closely. Slow to safe stop if needed.' } },
        { label: 'Call anyway (timeout)', type: 'neutral', response: { type: 'warn', msg: '🚨 No response received. Emergency call placed. Privacy override logged.' } },

const CAT_META = {
  collab:     { label: 'Collaboration',          color: 'var(--collab)',     bg: 'var(--collab-dim)' },
  ethics:     { label: 'Ethics',                 color: 'var(--ethics)',     bg: 'var(--ethics-dim)' },
  learn:      { label: 'Learning',               color: 'var(--learn)',      bg: 'var(--learn-dim)' },
  collective: { label: 'Collective Intelligence',color: 'var(--collective)', bg: 'var(--collective-dim)' },
};

let currentFilter = 'all';
let currentIdx = 0;
let filtered = [...SCENARIOS];

function getFiltered() {
  return currentFilter === 'all' ? SCENARIOS : SCENARIOS.filter(s => s.cat === currentFilter);
}

function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  filtered = getFiltered();
  const cats = ['collab','ethics','learn','collective'];
  sidebar.innerHTML = cats.map(cat => {
    const items = filtered.filter(s => s.cat === cat);
    if (!items.length) return '';
    const meta = CAT_META[cat];
    return `
      <div class="sidebar-section">
        <div class="sidebar-label" style="color:${meta.color}">${meta.label}</div>
        ${items.map(s => `
          <button class="scenario-btn ${s === filtered[currentIdx] ? 'active' : ''}"
            style="--accent-color:${meta.color}"
            data-id="${s.id}">
            <span class="s-icon">${s.icon}</span>
            <div>
              <div class="s-title">${s.title}</div>
              <div class="s-tag">${s.subtitle}</div>
            </div>
          </button>`).join('')}
      </div>`;
  }).join('');

  sidebar.querySelectorAll('.scenario-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = filtered.findIndex(s => s.id === btn.dataset.id);
      if (idx >= 0) { currentIdx = idx; renderAll(); }
    });
  });
}

function renderProgress() {
  const strip = document.getElementById('progressStrip');
  strip.innerHTML = filtered.map((s, i) => {
    const meta = CAT_META[s.cat];
    const cls = i === currentIdx ? 'active' : i < currentIdx ? 'visited' : '';
    return `<div class="progress-dot ${cls}" style="--accent-current:${meta.color}" data-i="${i}" title="${s.title}"></div>`;
  }).join('');
  strip.querySelectorAll('.progress-dot').forEach(d => {
    d.addEventListener('click', () => { currentIdx = +d.dataset.i; renderAll(); });
  });
}

function renderMain() {
  const main = document.getElementById('main');
  const s = filtered[currentIdx];
  if (!s) { main.innerHTML = '<p style="color:var(--text-dim);padding:40px">No scenarios in this category.</p>'; return; }
  const meta = CAT_META[s.cat];
  const color = meta.color;
  const bg = meta.bg;

  const fleetHTML = s.terminal.fleet ? `
    <div class="fleet-grid" id="fleet-${s.id}">
      ${Array.from({length: 32}, (_, i) => {
        const cls = i < 6 ? 'reporting' : i === 16 ? 'you' : i < 20 ? 'affected' : '';
        return `<div class="fleet-car ${cls}">${i === 16 ? '🚗' : '🚙'}</div>`;
      }).join('')}
    </div>` : '';

  const confHTML = s.showConfidence ? `
    <div class="card" style="grid-column:1/-1">
      <div class="card-title">${s.showConfidence.label}</div>
      <p style="font-size:12px;color:var(--text-dim);margin-bottom:6px">${s.showConfidence.label2}</p>
      <div class="confidence-bar">
        <div class="confidence-fill" id="conf-fill-${s.id}" style="width:0%;background:${s.showConfidence.color}"></div>
      </div>
      <p style="font-size:20px;font-weight:700;color:${s.showConfidence.color};margin-top:6px" id="conf-val-${s.id}">0%</p>
    </div>` : '';

  const actionsHTML = s.terminal.actions.length ? `
    <div class="terminal-actions">
      ${s.terminal.actions.map((a, i) => `
        <button class="t-btn ${a.type}" data-i="${i}" data-sid="${s.id}">
          ${a.label}
        </button>`).join('')}
    </div>
    ${s.terminal.actions.map((a, i) => `
      <div class="response-bubble ${a.response.type}" id="resp-${s.id}-${i}">
        ${a.response.msg}
      </div>`).join('')}
  ` : '';

  main.innerHTML = `
    <div class="scenario-view">
      <div class="scenario-header">
        <div class="scenario-icon-big">${s.icon}</div>
        <div class="scenario-meta">
          <span class="cat-badge" style="color:${color};background:${bg};border:1px solid ${color}33">${meta.label}</span>
          <div class="scenario-title">${s.title}</div>
          <div class="scenario-subtitle">${s.subtitle}</div>
        </div>
      </div>

      <div class="cards">
        <div class="card" style="grid-column:1/-1">
          <div class="card-title">Situation</div>
          <p>${s.situation}</p>
        </div>
        <div class="card">
          <div class="card-title" style="color:${color}">Human Role</div>
          <ul>${s.humanRole.map(r => `<li>${r}</li>`).join('')}</ul>
        </div>
        <div class="card">
          <div class="card-title" style="color:${color}">AI Role</div>
          <ul>${s.aiRole.map(r => `<li>${r}</li>`).join('')}</ul>
        </div>
        ${confHTML}
      </div>

      ${fleetHTML}

      <div class="ai-terminal">
        <div class="terminal-bar">
          <div class="terminal-dot" style="background:#ff5f56"></div>
          <div class="terminal-dot" style="background:#ffbd2e"></div>
          <div class="terminal-dot" style="background:#27c93f"></div>
          <span>AI System Log · ${s.title}</span>
        </div>
        <div class="terminal-body">
          ${s.terminal.lines.map(l => `
            <div class="terminal-line">
              <span class="prefix" style="color:${l.highlight ? color : ''}">${l.prefix}</span>
              <span class="msg ${l.highlight ? 'highlight' : ''}" style="${l.highlight ? `color:${color}` : ''}">${l.msg}</span>
            </div>`).join('')}
          ${actionsHTML}
        </div>
      </div>

      <div class="insights">
        ${s.insights.map(ins => `
          <div class="insight" style="color:${color};border-color:${color}44;background:${bg}">
            ${ins}
          </div>`).join('')}
      </div>

      <div class="nav-row">
        <button class="nav-btn" id="prevBtn" ${currentIdx === 0 ? 'disabled' : ''}>
          ← Previous
        </button>
        <span class="nav-counter">${currentIdx + 1} / ${filtered.length}</span>
        <button class="nav-btn" id="nextBtn" ${currentIdx === filtered.length - 1 ? 'disabled' : ''}>
          Next →
        </button>
      </div>
    </div>`;

  // Events
  main.querySelectorAll('.t-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = btn.dataset.i;
      const sid = btn.dataset.sid;
      const resp = document.getElementById(`resp-${sid}-${i}`);
      if (resp) { resp.classList.add('show'); }
      main.querySelectorAll(`.t-btn[data-sid="${sid}"]`).forEach(b => b.classList.add('clicked'));
    });
  });

  document.getElementById('prevBtn')?.addEventListener('click', () => { if (currentIdx > 0) { currentIdx--; renderAll(); } });
  document.getElementById('nextBtn')?.addEventListener('click', () => { if (currentIdx < filtered.length - 1) { currentIdx++; renderAll(); } });

  // Animate confidence bar
  if (s.showConfidence) {
    setTimeout(() => {
      const fill = document.getElementById(`conf-fill-${s.id}`);
      const val = document.getElementById(`conf-val-${s.id}`);
      if (fill) { fill.style.width = s.showConfidence.value + '%'; }
      if (val) {
        let n = 0;
        const interval = setInterval(() => {
          n = Math.min(n + 2, s.showConfidence.value);
          val.textContent = n + '%';
          if (n >= s.showConfidence.value) clearInterval(interval);
        }, 20);
      }
    }, 100);
  }
}

function renderAll() {
  filtered = getFiltered();
  if (currentIdx >= filtered.length) currentIdx = 0;
  renderSidebar();
  renderProgress();
  renderMain();
  // Scroll main to top
  document.getElementById('main').scrollTop = 0;
}

// Tabs
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter = tab.dataset.cat;
    currentIdx = 0;
    renderAll();
  });
});

// Keyboard nav
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && currentIdx < filtered.length - 1) { currentIdx++; renderAll(); }
  if (e.key === 'ArrowLeft' && currentIdx > 0) { currentIdx--; renderAll(); }
});

renderAll();
</script>
